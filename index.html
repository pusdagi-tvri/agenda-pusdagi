<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Kartu Kanan - TVRI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0F172A;
      --color-card: #111827;
      --color-card-alt: #1E293B;
      --border-glass: rgba(255, 255, 255, 0.08);
    }

    * { font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--color-bg);
      color: #F8FAFC;
      padding: 40px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-flat {
      background: var(--color-card);
      border: 1px solid var(--border-glass);
    }

    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .card-shadow {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .card-hover {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.35s ease, 
                  border-color 0.35s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      border-color: rgba(255, 255, 255, 0.16);
    }

    @keyframes pulseLive {
      0%   { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .watermark-icon {
      opacity: 0.08;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover .watermark-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .badge-live {
      animation: pulseLive 1.8s ease-out infinite;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Container simulasi kolom kanan -->
  <div class="w-[500px] flex flex-col gap-4">

    <!-- 1. KARTU SEDANG BERLANGSUNG -->
    <section class="glass card-shadow card-hover rounded-[20px] p-6 relative overflow-hidden" style="height:195px;">
      <!-- Watermark -->
      <div class="absolute -right-6 top-2 text-amber-500 pointer-events-none watermark-icon">
        <svg width="130" height="130" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>

      <!-- Live indicator -->
      <div class="flex items-center gap-2 mb-2 relative z-10">
        <span class="w-2 h-2 rounded-full bg-[#22C55E] badge-live"></span>
        <span class="text-[11px] font-semibold text-[#22C55E] uppercase tracking-wider">Sedang Berlangsung</span>
      </div>

      <!-- Konten -->
      <div class="relative z-10">
        <h2 class="text-xl font-bold text-white mb-1">Uji Coba Fitur Baru</h2>
        <p class="text-sm text-[#CBD5E1]">11:30 - 16:00 · Ruang Rapat Pusdagi Gedung LPSE</p>
        <div class="flex items-center gap-2 mt-3">
          <div class="h-1.5 flex-1 rounded-full bg-[#334155] overflow-hidden">
            <div class="h-full rounded-full bg-[#F59E0B]" style="width:62%;"></div>
          </div>
          <span class="text-xs font-medium text-[#F59E0B] tabular-nums">62%</span>
        </div>
        <p class="text-xs text-[#94A3B8] mt-2">Berakhir dalam 3 jam 17 menit</p>
      </div>
    </section>

    <!-- 2. KARTU AGENDA BERIKUTNYA -->
    <section class="card-flat card-shadow card-hover rounded-[20px] p-6 relative overflow-hidden" style="height:135px;">
      <!-- Watermark -->
      <div class="absolute -right-4 -bottom-4 text-blue-500 pointer-events-none watermark-icon">
        <svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>

      <!-- Header -->
      <div class="flex items-center gap-2 mb-2 relative z-10">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        <span class="text-[11px] font-semibold text-[#94A3B8] uppercase tracking-wider">Agenda Berikutnya</span>
      </div>

      <!-- Konten -->
      <div class="relative z-10 flex items-center h-[calc(100%-28px)]">
        <div class="flex items-center gap-3 text-[#CBD5E1]">
          <span class="text-sm">📅</span>
          <span class="font-medium">Tidak ada agenda berikutnya hari ini.</span>
        </div>
      </div>
    </section>

    <!-- 3. KARTU STATISTIK KATEGORI -->
    <section class="card-flat card-shadow card-hover rounded-[20px] p-6 relative overflow-hidden" style="height:200px;">
      <!-- Watermark -->
      <div class="absolute -right-8 -bottom-6 text-slate-500 pointer-events-none watermark-icon">
        <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
          <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
        </svg>
      </div>

      <!-- Header -->
      <h2 class="text-base font-semibold text-[#94A3B8] tracking-wide uppercase mb-4 flex items-center gap-2 relative z-10">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
          <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
        </svg>
        Statistik Kategori
      </h2>

      <!-- Konten -->
      <div class="relative z-10 space-y-3">
        <!-- Item 1 -->
        <div class="flex justify-between items-center py-1.5 px-3 rounded-xl bg-white/5 border border-white/5">
          <span class="text-sm font-medium text-[#F8FAFC]">Rapat Internal</span>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-[#2563EB] tabular-nums">1</span>
            <span class="text-xs text-[#64748B]">agenda</span>
          </div>
        </div>
        <!-- Item 2 -->
        <div class="flex justify-between items-center py-1.5 px-3 rounded-xl bg-white/5 border border-white/5">
          <span class="text-sm font-medium text-[#F8FAFC]">Uji Coba Produk</span>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-[#22C55E] tabular-nums">0</span>
            <span class="text-xs text-[#64748B]">agenda</span>
          </div>
        </div>
        <!-- Item 3 -->
        <div class="flex justify-between items-center py-1.5 px-3 rounded-xl bg-white/5 border border-white/5">
          <span class="text-sm font-medium text-[#F8FAFC]">Kunjungan Lapangan</span>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-[#F59E0B] tabular-nums">0</span>
            <span class="text-xs text-[#64748B]">agenda</span>
          </div>
        </div>
      </div>
    </section>

  </div>
</body>
</html>
